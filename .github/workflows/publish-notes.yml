# Builds the lecture notes (site + PDF) on GitHub and publishes them to the
# gh-pages branch. Manual trigger only while testing: Actions tab → "Publish notes"
# → Run workflow. Needs one local `quarto publish gh-pages` first (see notes/README.md).
name: Publish notes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
          tinytex: true
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
