# The staging profile (_quarto-staging.yml) adds noindex; that file exists only in the
# staging repository and is not copied on release.
profile:
  default: staging

project:
  type: book
  output-dir: _site

book:
  title: "Near-term Quantum Computing — lecture notes"
  author: "Stefano Polla"
  date: "2026-10-16"
  chapters:
    - index.qmd
    - l01-platforms-and-measurement.qmd
  appendices:
    - exercises.qmd
    - glossary.qmd
  site-url: https://stefanopolla.github.io/course-testing/
  repo-url: https://github.com/StefanoPolla/course-testing
  repo-subdir: notes
  downloads: [pdf]
  output-file: ntqc-lecture-notes

bibliography: references.bib
metadata-files:
  - glossary.yml
filters:
  - exercises.lua
  - tutorials.lua
  - glossary.lua
  - changes.lua  # temporary: review highlighting
crossref:
  chapters: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    html-math-method: mathjax
    default-image-extension: svg
    number-sections: true
    toc: true
    include-after-body: glossary-tooltips.html
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    default-image-extension: pdf
    include-in-header: macros.tex
    fig-pos: 'htb'
    number-sections: true
    colorlinks: true
